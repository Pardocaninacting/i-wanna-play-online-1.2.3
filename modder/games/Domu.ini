# Domu: the world object is named oController (candidate table tries world/World/objWorld/oWorld only).
# The player's bullet object is oPlayerBullet (from gml_Script_playerShoot); it has no default
# sprite, so default-sprite matching instead picks oAttack2 (one of 9 objects sharing sBullet),
# which would relay boss attacks as player bullets. Named explicitly here.
[iwpo]
world=oController
bullet_object=oPlayerBullet
# oPlayerBullet has no default sprite; the candidate table resolves the bullet
# sprite to sBullet (a 9-frame effect shared by boss attacks). The real bullet
# visual is sPlayerBullet (assigned at runtime by the game). Fixes both the
# remote-proxy fallback sprite and the skin bullet-strip pacing base.
skins.map.bullet=sPlayerBullet
