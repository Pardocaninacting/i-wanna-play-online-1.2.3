[menu.hint.pvp]
text = 玩家对战模式。开启时子弹保持可见。

[menu.hint.bullets]
text = 与房间共享你的子弹（PVP 中锁定为开）。

[menu.hint.save_row]
text = Enter 应用此存档。F 收藏，1-8 快捷键，Del 清除。

[menu.hint.favourites]
text = 只显示收藏的存档。

[menu.hint.clear_saves]
text = 删除每个非收藏的存档文件。

[menu.hint.rebind]
text = Enter 或点击开始捕获，然后按下按键。Esc 取消。

[menu.hint.reset_keys]
