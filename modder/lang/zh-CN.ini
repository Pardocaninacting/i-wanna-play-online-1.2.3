[menu.desc.reconnect]
text = 断开当前连接并重新连接。

[menu.desc.apply_reconnect]
text = 保存账户并以新身份重连，无需重启。

[menu.desc.name]
text = 你的游戏内名称。会写入账户存储，并在连接时发送给服务器。

[menu.desc.password]
text = 会话密钥：使用相同密钥的玩家会互相遇见。它不是账户密码，可以为空。

[menu.desc.store]
text = 名称与密钥的保存位置。全局对本机所有游戏生效。

[menu.desc.team]
text = 队伍颜色，用于名字和玩家列表。

[menu.desc.lerp]
text = 在网络更新之间插值远端玩家：更平滑但略有延迟。轻度 = 0.35，标准 = 0.5，强 = 0.65（每帧）。

[menu.desc.on_failure]
text = 所有重连尝试都失败时：留在游戏中离线游玩（可从菜单重连）或退出。

[menu.desc.server]
text = 服务器地址。保存到配置并立即重连——当前服务器不可达时的应急通道。

[menu.desc.tcp]
text = 游戏流量的 TCP 端口（登录、存档、聊天）。保存并重连。

[menu.desc.udp]
text = 实时玩家位置的 UDP 端口。保存并重连。

[menu.desc.save_history]
text = 本地共享存档历史上限。超出后较旧的非收藏条目会被移除。

[menu.desc.chat_history]
text = 聊天日志保留的行数。

[menu.desc.save]
text = 共享联机存档。游戏中按 T 键切换。

[menu.desc.fast]
text = 快速存读档路径，适用于读档会重启房间的引擎。

[menu.desc.pvp]
text = 玩家对战。开启时子弹保持可见。

[menu.desc.bullets]
text = 与房间内的玩家共享你的子弹。PVP 开启时强制锁定为开。

[menu.desc.visual]
text = 其他玩家的绘制方式：完整、仅名字或隐藏。

[menu.desc.indicator]
text = 远端玩家头顶的方向指示。

[menu.desc.spec_cam]
text = 旁观者镜头模式。

[menu.desc.menu_layout]
text = 自动按窗口大小选择布局；紧凑是 480px 纯列表面板；完整始终显示详情栏。

[menu.desc.hide_others]
text = 不绘制其他玩家的标记，其到达音效静音。你自己的标记仍显示。

[menu.desc.hide_all]
text = 完全不绘制任何标记。发送标记仍然可用，画布模式仍会收集。

[menu.desc.save_row]
text = Enter 应用此存档。F 切换收藏，1-8 分配快捷键，Del 清除。

[menu.desc.favourites]
text = 只显示收藏的存档。

[menu.desc.clear_saves]
text = 删除非收藏的存档。

[menu.desc.player_objects]
text = 选择哪个玩家对象来操控你的角色。

[menu.desc.rebind]
text = 重新绑定此操作。Enter 开始捕获，然后按下你想用的键；Esc 取消。

[menu.desc.reset_keys]
text = 将以上所有绑定恢复为默认值。

[menu.desc.sync]
text = 在存档时以及位变化时，将列出的全局变量发送给房间内的所有人。

[menu.desc.skin_row]
text = 来自 iwposkins 的玩家皮肤。Enter 应用。左右键（或预览下的 < >）在全部七种动画状态间切换。

[menu.desc.auto_download]
text = 当其他玩家使用你没有的皮肤时，自动下载。

[menu.desc.clear_skin]
text = 卸载当前皮肤，恢复游戏默认的玩家精灵。

[menu.desc.search]
text = 按名称、作者或来源过滤列表（不区分大小写）。在页签任意位置按 F 打开；关键词为空时显示全部。

[menu.desc.sync_entry]
text = 在存档时及位变化时发送。在此游戏中缺少该全局变量的条目会被跳过（见"存在"）。

[menu.desc.game]
text = 评分按游戏存储在服务器上；本服务器上的所有人共享同一列表。

[menu.desc.stars]
text = 你对本游戏的评分。左右键逐级调整，数字键 1-5 直接设定，0 表示不评分。

[menu.desc.cleared]
text = 你是否已通关本游戏。与星级一起提交。

[menu.desc.last_result]
text = 服务器对你上次提交的响应。两次提交之间需要间隔几秒。

[menu.desc.submit]
text = 将评分发送到服务器。

[menu.hint.name]
text = 你的游戏内名称——Enter 编辑。保存到账户存储。

[menu.hint.password]
