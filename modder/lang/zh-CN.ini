[menu.hint.sync]
text = 与房间共享配置的全局变量。

[menu.hint.sync_entry]
text = 一个已同步的全局变量。

[menu.hint.skin_row]
text = Enter 应用。左右键切换预览动画。

[menu.hint.auto_download]
text = 自动下载玩家列表中出现的未知皮肤。

[menu.hint.clear_skin]
text = 恢复游戏默认的玩家精灵。

[menu.hint.search]
